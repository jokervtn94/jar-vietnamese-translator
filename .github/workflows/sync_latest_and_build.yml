name: Sync latest source and build Windows portable

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/sync_latest_and_build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct source archive
        shell: bash
        run: |
          cat .bootstrap/source.part* > source.b64
          base64 -d source.b64 > source.zip
          mkdir extracted
          unzip -q source.zip -d extracted
      - name: Synchronize repository source
        shell: bash
        run: |
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.bootstrap/' \
            extracted/ ./
          rm -f source.b64 source.zip
          rm -rf extracted .bootstrap
      - name: Commit synchronized source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m 'chore: sync latest JAR Vietnamese Translator source'
            git push
          fi

  build-portable:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct latest source
        shell: pwsh
        run: |
          $parts = Get-ChildItem '.bootstrap/source.part*' | Sort-Object Name
          $joined = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes('source.zip', [Convert]::FromBase64String($joined))
          Expand-Archive -Path 'source.zip' -DestinationPath 'src' -Force
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'src/requirements.txt'
      - name: Install dependencies
        shell: pwsh
        working-directory: src
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pytest
      - name: Run tests
        shell: pwsh
        working-directory: src
        run: |
          $env:PYTHONPATH='.'
          python -m pytest -q
      - name: Build portable application
        shell: pwsh
        working-directory: src
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name 'JAR Vietnamese Translator' --collect-all PySide6 app.py
      - name: Package portable ZIP
        shell: pwsh
        run: |
          $out = 'portable'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item 'src/dist/JAR Vietnamese Translator/*' $out -Recurse
          @'
          JAR Vietnamese Translator - Windows Portable

          Khong can cai Python.
          Giai nen toan bo file ZIP truoc khi chay.
          Chay "JAR Vietnamese Translator.exe" de mo ung dung.
          Khong xoa cac file/thu muc nam canh file EXE.
          '@ | Set-Content -Encoding UTF8 "$out/README_PORTABLE.txt"
          Compress-Archive -Path "$out/*" -DestinationPath 'JAR_Vietnamese_Translator_Windows_Portable.zip' -Force
      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: JAR_Vietnamese_Translator_Windows_Portable
          path: JAR_Vietnamese_Translator_Windows_Portable.zip
          if-no-files-found: error
          retention-days: 30
