name: Build Modular Windows Portable

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'launcher.py'
      - 'requirements.txt'
      - 'JAR_Translator.spec'
      - 'app/core/version.py'
      - 'app/gui/cumulative_ui_polish_hook.py'
      - 'app/gui/latest_translation_ui_hook.py'
      - 'config/modules.json'
      - 'config/integrated_patches.json'
      - '.github/workflows/build_portable.yml'

permissions:
  contents: read

jobs:
  build-windows-portable:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pytest

      - name: Compile sources
        shell: pwsh
        run: python -m compileall -q .

      - name: Run regression tests
        shell: pwsh
        run: python -m pytest -q

      - name: Build stable runtime launcher
        shell: pwsh
        run: |
          if (Test-Path build) { Remove-Item build -Recurse -Force }
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          python -m PyInstaller --noconfirm --clean JAR_Translator.spec

      - name: Add external modular app
        shell: pwsh
        run: |
          $root = 'dist/JAR Vietnamese Translator'
          Copy-Item 'app' "$root/app" -Recurse
          Copy-Item 'config' "$root/config" -Recurse
          if (Test-Path 'assets') { Copy-Item 'assets' "$root/assets" -Recurse }
          New-Item -ItemType Directory -Force -Path "$root/updates" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/logs" | Out-Null

      - name: Verify cumulative modular portable layout
        shell: pwsh
        run: |
          $root = 'dist/JAR Vietnamese Translator'
          @(
            "$root/JAR Vietnamese Translator.exe",
            "$root/app/bootstrap.py",
            "$root/app/core/jar_scanner.py",
            "$root/app/core/version.py",
            "$root/app/gui/main_window.py",
            "$root/app/gui/patch_update_hook.py",
            "$root/app/gui/cumulative_ui_polish_hook.py",
            "$root/app/gui/latest_translation_ui_hook.py",
            "$root/app/themes/monokai_light.qss",
            "$root/config/modules.json",
            "$root/config/integrated_patches.json"
          ) | ForEach-Object { if (!(Test-Path $_)) { throw "Missing cumulative modular file: $_" } }

          $modules = Get-Content "$root/config/modules.json" -Raw | ConvertFrom-Json
          if ($modules.app_version -ne '4.31-cumulative') { throw "Unexpected app_version: $($modules.app_version)" }
          $patches = Get-Content "$root/config/integrated_patches.json" -Raw | ConvertFrom-Json
          if ($patches.patch_level -ne 'v434') { throw "Unexpected patch level: $($patches.patch_level)" }

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $portable = 'JAR Vietnamese Translator Portable'
          if (Test-Path $portable) { Remove-Item $portable -Recurse -Force }
          Copy-Item 'dist/JAR Vietnamese Translator' $portable -Recurse
          @'
          JAR Vietnamese Translator

          Phien ban: 4.31
          Khong can cai Python.
          Chay: JAR Vietnamese Translator.exe

          Baseline nay da tich hop cac patch hoan chinh den patch level v434.
          Bao gom giao dien dich moi nhat: icon file/danh muc, thong tin chuoi da sua bo cuc, va da xoa goi y dich.
          Danh sach patch tich hop: config/integrated_patches.json

          Quan trong:
          - Runtime nam canh EXE va chi can build lai khi runtime/launcher thay doi.
          - Code chuc nang nam trong app/.
          - Theme nam trong app/themes/.
          - Patch nho moi co the cap nhat file trong app/ ma khong build lai runtime.
          - Khong can ap dung lai cac patch da co trong integrated_patches.json.
          '@ | Set-Content -Encoding UTF8 "$portable/README_PORTABLE.txt"
          $zip = 'JAR_Vietnamese_Translator_Modular_Windows_Portable.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$portable/*" -DestinationPath $zip -CompressionLevel Optimal
          (Get-FileHash $zip -Algorithm SHA256).Hash | Set-Content -Encoding ascii 'JAR_Vietnamese_Translator_Modular_Windows_Portable.sha256'

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: JAR_Vietnamese_Translator_Modular_Windows_Portable
          path: |
            JAR_Vietnamese_Translator_Modular_Windows_Portable.zip
            JAR_Vietnamese_Translator_Modular_Windows_Portable.sha256
          if-no-files-found: error
          retention-days: 30
