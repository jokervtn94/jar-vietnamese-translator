name: tests

on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run maintained regression tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python tests/test_v42_responsive_ui.py
          python tests/test_v43_deep_scan.py
          python tests/test_v44_precision_scan.py
          python tests/test_v45_json_exchange.py
          python tests/test_v46_json_protocol.py
          python tests/test_v461_jar_extension.py
