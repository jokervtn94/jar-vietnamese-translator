name: Materialize latest source

on:
  push:
    branches:
      - sync-full-latest-20260912
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[materialized]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: sync-full-latest-20260912
          fetch-depth: 0

      - name: Reconstruct verified source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .bootstrap/latestbundle.part000 \
            .bootstrap/latestbundle.part001 \
            .bootstrap/latestbundle.part002 \
            .bootstrap/latestbundle.part003 \
            .bootstrap/latestbundle.part004 \
            .bootstrap/latestbundle.part005 \
            .bootstrap/latestbundle.part006 \
            .bootstrap/latestbundle.part007 \
            .bootstrap/latestbundle.part008 \
            .bootstrap/missing.part009 \
            .bootstrap/latestbundle.part010 \
            .bootstrap/latestbundle.part011 \
            .bootstrap/latestbundle.part012 \
            .bootstrap/c013.0 \
            .bootstrap/c013.1 \
            .bootstrap/c013.2 \
            .bootstrap/c013.3 \
            .bootstrap/c013.4 \
            .bootstrap/c013.5 \
            .bootstrap/latestbundle.part013 \
            .bootstrap/latestbundle.part014 \
            .bootstrap/latestbundle.part015 \
            .bootstrap/exact.part020 \
            .bootstrap/c021.0 \
            .bootstrap/c021.1 \
            .bootstrap/c021.2 \
            .bootstrap/c021.3 \
            .bootstrap/c021.4 \
            .bootstrap/c021.5 \
            .bootstrap/exact.part022 \
            .bootstrap/exact.part023 \
            .bootstrap/missing.part024 \
            .bootstrap/latestsegment.005 \
            | tr -d '\r\n' | base64 --decode > /tmp/latest_source_bundle.zip
          echo "a843962ce7c5dd43a4e69e2e53d7986f545141b07cf3fe360b7d8520c0276336  /tmp/latest_source_bundle.zip" | sha256sum -c -
          unzip -t /tmp/latest_source_bundle.zip
          rm -rf /tmp/materialized
          mkdir -p /tmp/materialized
          unzip -q /tmp/latest_source_bundle.zip -d /tmp/materialized

      - name: Replace branch with exact latest source
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' /tmp/materialized/ ./

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies and test
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: '1'
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          python -m pytest -q
          python -m compileall -q .

      - name: Commit exact materialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "sync: materialize latest source [materialized]"
          git push origin HEAD:sync-full-latest-20260912
