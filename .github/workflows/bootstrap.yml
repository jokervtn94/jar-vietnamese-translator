name: bootstrap-project

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and unpack clean project bundle
        run: |
          cat .bootstrap/chunk_00.txt .bootstrap/chunk_01.txt .bootstrap/chunk_02.txt .bootstrap/chunk_03_08.txt | tr -d '\n\r ' | base64 -d > /tmp/project.zip
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/project.zip') as z:
              z.extractall('.')
          PY
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
      - name: Validate extracted source
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m compileall -q .
      - name: Commit source tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: import JAR Vietnamese Translator V4.6 source' || exit 0
          git push
