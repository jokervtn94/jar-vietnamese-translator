name: bootstrap-project

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/project.zip'
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack clean project bundle
        run: |
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('.bootstrap/project.zip') as z:
              z.extractall('.')
          PY
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
      - name: Commit source tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: import JAR Vietnamese Translator V4.6 source' || exit 0
          git push
