name: import-v46-clean

on:
  push:
    branches: [source-import-v46-clean]
    paths:
      - '.stage3/READY'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble verified source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .stage3/part_*.txt | tr -d '\n\r ' | base64 -d > /tmp/project.zip
          echo "dc33196d240bfc8606ee6177cf95cbefe7201cc131795bf62b1a49335b5901e5  /tmp/project.zip" | sha256sum -c -
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/project.zip') as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f'Bad ZIP member: {bad}')
              z.extractall('.')
          PY
          rm -rf .stage3
          rm -f .github/workflows/import_v46.yml
          rm -f .github/workflows/tests.yml
          rm -rf .bootstrap .payload
          rm -f .github/workflows/bootstrap.yml .github/workflows/unpack_payload.yml
      - name: Validate source
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m compileall -q .
          python tests/test_v42_responsive_ui.py
          python tests/test_v43_deep_scan.py
          python tests/test_v44_precision_scan.py
          python tests/test_v45_json_exchange.py
          python tests/test_v46_json_protocol.py
      - name: Commit clean V4.6 source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: import clean JAR Vietnamese Translator V4.6 source'
          git push
